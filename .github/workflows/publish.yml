name: Publish Aztec Benchmark Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version from package.json (e.g., 1.0.0 or 1.0.0-beta.1). Do NOT include the "v" prefix.'
        required: false
        type: string

permissions:
  contents: read
  # npm trusted publishing (OIDC): the npm CLI exchanges the job's GitHub OIDC token for a
  # short-lived publish token. The trusted publisher must be configured on npmjs.com for
  # this repository and this workflow file (publish.yml). No NPM_TOKEN is used.
  id-token: write

# Serialize publishes per ref so rapid pushes don't publish concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Canary: every code-bearing push to main. Ungated environment, published under the
  # `canary` dist-tag as 0.0.0-snapshot.<sha> (never `latest`).
  canary:
    if: github.event_name == 'push'
    environment: canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out github repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.0
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Build
        run: yarn build

      - name: Set canary version
        run: yarn version --new-version "0.0.0-snapshot.${GITHUB_SHA::8}" --no-git-tag-version

      - name: Publish canary
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: re-running the same commit must not 409 on an existing version.
          # The OIDC token only authorizes `npm publish`, so dist-tags are left as they are.
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published; skipping."
          else
            npm publish --ignore-scripts --access public --tag canary
          fi

  # Stable: GitHub Release targeting main, or a manual dispatch/call from main.
  # Gated environment (requires an approver). Published to `latest` (or a prerelease
  # channel like `rc`/`beta` for hyphenated versions).
  stable:
    if: >-
      (github.event_name == 'release' && github.event.release.draft == false && github.event.release.target_commitish == 'main') ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main')
    environment: Publisher
    runs-on: ubuntu-latest
    steps:
      - name: Check out github repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.0
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Validate input version matches package.json
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Input version: $INPUT_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match package.json version ($PKG_VERSION). Update package.json or re-run with the matching version (no 'v' prefix)."
            exit 1
          fi

      - name: Validate release tag matches package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"   # Strip an optional leading "v"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION). Bump package.json on main before cutting the release, and tag it to match (a 'v' prefix is allowed)."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Build
        run: yarn build

      - name: Publish
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"    # Remove everything before first -
            TAG="${TAG%%.*}"       # Remove everything after first .
          else
            TAG="latest"
          fi
          # Idempotent: a re-run of an already-published version must not 409. The OIDC
          # token only authorizes `npm publish`, so a stale dist-tag has to be moved by a
          # maintainer with `npm dist-tag add`.
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            CURRENT=$(npm view "$PKG" "dist-tags.$TAG")
            if [ "$CURRENT" = "$VERSION" ]; then
              echo "$PKG@$VERSION already published under '$TAG'; nothing to do."
            else
              echo "::warning::$PKG@$VERSION is already published but '$TAG' points to '${CURRENT:-nothing}'. Trusted publishing cannot move dist-tags; if intended, run: npm dist-tag add $PKG@$VERSION $TAG"
            fi
          else
            npm publish --ignore-scripts --access public --tag "$TAG"
          fi
