name: Publish Aztec Benchmark Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version from package.json (e.g., 1.0.0 or 1.0.0-beta.1). Do NOT include the "v" prefix.'
        required: false
        type: string

permissions:
  contents: read

# Serialize publishes per ref so rapid pushes don't publish concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Canary: every code-bearing push to main. Ungated environment, published under the
  # `canary` dist-tag as 0.0.0-snapshot.<sha> (never `latest`).
  canary:
    if: github.event_name == 'push'
    environment: canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out github repository
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Build
        run: yarn build

      - name: Set canary version
        run: yarn version --new-version "0.0.0-snapshot.${GITHUB_SHA::8}" --no-git-tag-version

      - name: Publish canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: re-running the same commit must not 409 on an existing version.
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published; moving the 'canary' dist-tag to it."
            npm dist-tag add "$PKG@$VERSION" canary
          else
            npm publish --ignore-scripts --access public --tag canary
          fi

  # Stable: GitHub Release targeting main, or a manual dispatch/call from main.
  # Gated environment (requires an approver). Published to `latest` (or a prerelease
  # channel like `rc`/`beta` for hyphenated versions).
  stable:
    if: >-
      (github.event_name == 'release' && github.event.release.draft == false && github.event.release.target_commitish == 'main') ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main')
    environment: Publisher
    runs-on: ubuntu-latest
    steps:
      - name: Check out github repository
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Validate input version matches package.json
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Input version: $INPUT_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match package.json version ($PKG_VERSION). Update package.json or re-run with the matching version (no 'v' prefix)."
            exit 1
          fi

      - name: Validate release tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"   # Strip an optional leading "v"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION). Bump package.json on main before cutting the release, and tag it to match (a 'v' prefix is allowed)."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Build
        run: yarn build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"    # Remove everything before first -
            TAG="${TAG%%.*}"       # Remove everything after first .
          else
            TAG="latest"
          fi
          # Idempotent: a re-run of an already-published version re-points the dist-tag
          # instead of failing with a 409.
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published; ensuring the '$TAG' dist-tag points to it."
            npm dist-tag add "$PKG@$VERSION" "$TAG"
          else
            npm publish --ignore-scripts --access public --tag "$TAG"
          fi
