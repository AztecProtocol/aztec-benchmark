name: Update Baseline Benchmarks

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label"
        type: string
        default: "ubuntu-latest-m"
      timeout:
        description: "Job timeout in minutes"
        type: number
        default: 120
      bench-dir:
        description: "Directory for benchmark files"
        type: string
        default: "./benchmarks"
      current-suffix:
        description: "Suffix for benchmark report files"
        type: string
        default: "_latest"
      block-duration-ms:
        description: "Local-network block duration in ms, exported as SEQ_BLOCK_DURATION_MS. Empty keeps the Aztec default (3000). 6000 matches mainnet's block duration and raises the per-tx DA gas cap from 55836 to 117624."
        type: string
        default: ""

permissions:
  contents: read
  actions: write

env:
  BENCH_DIR: ${{ inputs.bench-dir }}
  BENCH_SUFFIX: ${{ inputs.current-suffix }}

jobs:
  update-baseline:
    name: Update Baseline
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Configure block duration
        if: inputs.block-duration-ms != ''
        env:
          BLOCK_DURATION_MS: ${{ inputs.block-duration-ms }}
        run: |
          # Aztec parses this env var with parseFloat, so "6s" would silently mean 6 ms.
          if [[ ! "$BLOCK_DURATION_MS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::block-duration-ms must be a positive integer number of milliseconds"
            exit 1
          fi
          echo "SEQ_BLOCK_DURATION_MS=$BLOCK_DURATION_MS" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Dependency scripts and third-party installers run in this job; keep the write-scoped token off disk.
          persist-credentials: false

      - name: Setup Aztec environment
        uses: AztecProtocol/aztec-ci-actions/actions/setup-aztec@431859e477234b8690eb1f80d1305d2e34f10f1b # v0.1.1
        with:
          start-pxe: "true"
          run-codegen: "true"

      - name: Run benchmarks
        run: yarn aztec-benchmark --suffix "$BENCH_SUFFIX" --output-dir "$BENCH_DIR"

      - name: List baseline files
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Baseline files for branch: ${BRANCH_NAME}"
          ls -lh "$BENCH_DIR"/*"$BENCH_SUFFIX".benchmark.json

      - name: Encode branch name
        id: encode
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          encoded=$(echo "${BRANCH_NAME}" | sed 's/\//-/g')
          echo "branch-encoded=${encoded}" >> "$GITHUB_OUTPUT"

      - name: Upload baseline artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-baseline-${{ steps.encode.outputs.branch-encoded }}
          path: ${{ env.BENCH_DIR }}/*${{ env.BENCH_SUFFIX }}.benchmark.json
          retention-days: 90
          if-no-files-found: error
